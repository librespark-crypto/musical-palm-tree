<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<meta name="description" content="JEE PCM Syllabus &amp; Performance Tracker - official JEE Main 2026 and JEE Advanced 2026 syllabus tracking, lectures, revisions, questions, error book, mock tests, analytics and Gemini analysis.">
<title>JEE PCM Syllabus &amp; Performance Tracker</title>
<style>
/* ==========================================================================
   JEE PCM Tracker - design system
   Light, warm, rounded, outlined "storybook / manga" UI language.
   ========================================================================== */
:root{
  --paper:#FBF6EC;
  --paper-2:#F5EDDF;
  --card:#FFFFFF;
  --ink:#221C17;
  --ink-2:#4A4038;
  --ink-3:#8A7E70;
  --line:#221C17;
  --line-soft:#E4D9C6;
  --phy:#C3D8FA;
  --phy-d:#8FB4EE;
  --chem:#BFE9CD;
  --chem-d:#84CFA0;
  --math:#FBD2A9;
  --math-d:#F0AC6B;
  --sun:#FFD873;
  --rose:#F9BDD2;
  --sky:#B4E0E8;
  --violet:#D3BDF8;
  --red:#F8A79F;
  --green:#9FDFB1;
  --shadow: 0 6px 14px rgba(48,36,22,.08), 0 2px 4px rgba(48,36,22,.05);
  --shadow-pop: 0 12px 28px rgba(48,36,22,.14);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font-head:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:radial-gradient(circle at 12% 8%, #FFF3D6 0%, transparent 42%),
                   radial-gradient(circle at 88% 4%, #E7F3FF 0%, transparent 38%),
                   radial-gradient(circle at 50% 100%, #FDECF3 0%, transparent 45%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px; line-height:1.5; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-head);letter-spacing:-.02em;margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D8CCB8;border-radius:8px}

/* ---------- shell ---------- */
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(96px + var(--safe-b))}
.topbar{
  position:sticky;top:0;z-index:40;padding:14px 16px 10px;
  background:linear-gradient(180deg,rgba(251,246,236,.96),rgba(251,246,236,.82));
  backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;
}
.topbar .tl{flex:1;min-width:0}
.topbar h1{font-size:19px;font-weight:800}
.topbar .sub{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.iconbtn{
  width:40px;height:40px;border-radius:14px;border:1.5px solid var(--line);background:#fff;
  display:grid;place-items:center;box-shadow:2px 2px 0 rgba(34,28,23,.9);cursor:pointer;
}
.iconbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(34,28,23,.9)}
.iconbtn svg{width:19px;height:19px}
.screen{padding:14px 16px 8px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);
  padding:14px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden;
}
.card.flat{box-shadow:none}
.card.pad-lg{padding:18px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-h h3{font-size:15px;font-weight:800;flex:1;display:flex;align-items:center;gap:7px}
.card-h .mini{font-size:11.5px;color:var(--ink-3);font-weight:700}
.sect-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.sect-title .ln{flex:1;height:1.5px;background:var(--line-soft);border-radius:2px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.xsmall{font-size:11px}
.bold{font-weight:800}
.center{text-align:center}
.hr{height:1.5px;background:var(--line-soft);margin:12px 0;border-radius:2px}

/* ---------- badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;padding:2.5px 6px;border-radius:8px;border:1.5px solid var(--line);letter-spacing:.04em;line-height:1.15}
.badge.jm{background:#DCEBFF}
.badge.ja{background:#FFE3EC}
.badge.both{background:linear-gradient(90deg,#DCEBFF 50%,#FFE3EC 50%)}
.badge.ghost{background:#fff;border-style:dashed;color:var(--ink-3);border-color:var(--line-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3.5px 10px;font-size:11.5px;font-weight:700}
.pill.tap{cursor:pointer}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.soft{background:var(--paper-2);border-color:var(--line-soft)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex:0 0 auto}

/* status colours */
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:9px;border:1.5px solid var(--line);white-space:nowrap}
.st-not_started{background:#F1EBE0}
.st-learning{background:var(--sun)}
.st-completed{background:var(--green)}
.st-weak{background:var(--red)}
.st-revision_due{background:var(--violet)}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto}
.dot-not_started{background:#EFE7DA}.dot-learning{background:var(--sun)}.dot-completed{background:var(--green)}
.dot-weak{background:var(--red)}.dot-revision_due{background:var(--violet)}

/* subject tint helpers */
.t-phy{background:var(--phy)}.t-chem{background:var(--chem)}.t-math{background:var(--math)}
.tint-phy{background:linear-gradient(180deg,#EAF2FF,#fff)}
.tint-chem{background:linear-gradient(180deg,#EAF9EF,#fff)}
.tint-math{background:linear-gradient(180deg,#FFF3E6,#fff)}

/* ---------- progress ---------- */
.pbar{height:10px;border-radius:99px;background:#EFE7DA;border:1.5px solid var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .45s cubic-bezier(.2,.9,.25,1)}
.pbar.thin{height:7px}
.pbar.grad-phy>i{background:linear-gradient(90deg,#7FA8E8,#B9D2FB)}
.pbar.grad-chem>i{background:linear-gradient(90deg,#6FC894,#BFE9CD)}
.pbar.grad-math>i{background:linear-gradient(90deg,#EE9E52,#FBD2A9)}
.pbar.grad-ja>i{background:linear-gradient(90deg,#E48BA8,#F9BDD2)}
.pbar.grad-jm>i{background:linear-gradient(90deg,#6E9BE0,#C3D8FA)}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:800}
.metric .v{font-family:var(--font-head);font-size:19px;font-weight:800}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 15px;border-radius:15px;border:1.5px solid var(--line);background:#fff;
  font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:2.5px 2.5px 0 rgba(34,28,23,.9);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(0,0,0,.9)}
.btn.primary{background:var(--ink);color:#fff}
.btn.sun{background:var(--sun)}
.btn.chem{background:var(--chem)}
.btn.phy{background:var(--phy)}
.btn.math{background:var(--math)}
.btn.ghost{box-shadow:none;background:transparent;border-style:dashed}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:12px;box-shadow:2px 2px 0 rgba(34,28,23,.9)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:60;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1.5px solid var(--line);
  padding:8px 10px calc(8px + var(--safe-b));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;border-radius:14px;font-size:10px;font-weight:800;color:var(--ink-3);letter-spacing:.02em}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--ink);background:var(--paper-2)}
.nav a.on .nico{transform:translateY(-1px) scale(1.04)}
.fab{
  position:fixed;right:calc(50% - 250px + 14px);bottom:calc(88px + var(--safe-b));z-index:70;
  width:52px;height:52px;border-radius:18px;border:1.5px solid var(--line);background:var(--sun);
  display:grid;place-items:center;box-shadow:3px 3px 0 rgba(34,28,23,.9);cursor:pointer;
}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(34,28,23,.9)}
.fab svg{width:24px;height:24px}
@media (max-width:540px){ .fab{right:16px} }

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(34,28,23,.42);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{
  width:100%;max-width:520px;background:var(--paper);border:1.5px solid var(--line);border-bottom:none;
  border-radius:26px 26px 0 0;padding:14px 16px calc(20px + var(--safe-b));max-height:92vh;overflow:auto;
  animation:up .26s cubic-bezier(.2,.9,.25,1);
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:0;background:var(--paper);padding-bottom:8px}
.sheet-h h3{flex:1;font-size:17px;font-weight:800}
.grabber{width:44px;height:5px;border-radius:99px;background:var(--line-soft);margin:0 auto 10px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:none;font-size:14px;
}
.field textarea{min-height:84px;resize:vertical;font-family:var(--font-body)}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 3px #FFEBB8}
.field .hint{font-size:11px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .pill{flex:0 0 auto;cursor:pointer}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.li{
  background:#fff;border:1.5px solid var(--line);border-radius:var(--r-md);padding:11px 12px;
  box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;
}
.li.tap{cursor:pointer}
.li.tap:active{transform:translateY(1px)}
.li .ico{width:38px;height:38px;border-radius:13px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font-size:15px;font-weight:800}
.li .bd{flex:1;min-width:0}
.li .t{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li .s{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.li .chk{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;flex:0 0 auto;cursor:pointer}
.li .chk.on{background:var(--green)}
.li.done{opacity:.62}
.li.done .t{text-decoration:line-through}
.li.overdue{border-color:#C0503F;background:#FFF6F4}
.li.warn{background:#FFFBF0}

/* accordion */
.acc{border:1.5px solid var(--line);border-radius:var(--r-lg);background:#fff;overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow)}
.acc-h{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer;background:#fff}
.acc-b{padding:0 12px 12px;display:none;border-top:1.5px dashed var(--line-soft)}
.acc.open .acc-b{display:block;animation:fade .2s ease}
.acc.open .chev{transform:rotate(90deg)}
.chev{transition:transform .2s ease;color:var(--ink-3)}
.topicrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1.5px dashed var(--line-soft);cursor:pointer}
.topicrow:last-child{border-bottom:none}
.subrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0 6px 10px;border-left:2px solid var(--line-soft);margin-left:8px}
.subrow .nm{flex:1;font-size:12.5px;line-height:1.35}
.mini-bar{width:52px;height:8px;border-radius:99px;background:#EFE7DA;border:1px solid var(--line-soft);overflow:hidden;flex:0 0 auto}
.mini-bar>i{display:block;height:100%;background:var(--ink)}

/* ---------- misc ---------- */
.count{font-family:var(--font-head);font-weight:800}
.kpi{border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;padding:10px 11px;box-shadow:var(--shadow)}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:800}
.kpi .v{font-family:var(--font-head);font-size:20px;font-weight:800;line-height:1.15}
.kpi .d{font-size:10.5px;color:var(--ink-3);font-weight:600}
.hero{border:1.5px solid var(--line);border-radius:26px;padding:16px;background:linear-gradient(140deg,#FFF4DC,#FFE8F1 55%,#E9F3FF);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .big{font-family:var(--font-head);font-size:44px;line-height:1;font-weight:800;letter-spacing:-.03em}
.streak{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.streak svg{width:15px;height:15px;flex:0 0 auto}
.card-h .mini{white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);z-index:200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:700;box-shadow:var(--shadow-pop);animation:up .2s ease;max-width:88%}
.empty{text-align:center;padding:22px 12px;color:var(--ink-3);font-size:13px}
.empty .em{display:block;margin-bottom:8px;color:var(--ink-3)}
.empty .em svg{width:32px;height:32px}
.illus{display:block;margin:0 auto}
.timerpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:65;background:var(--ink);color:#fff;border-radius:999px;padding:7px 13px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:12.5px;box-shadow:var(--shadow-pop);border:1.5px solid var(--line)}
.timerpill .rec{width:8px;height:8px;border-radius:99px;background:var(--red);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.mark{background:#FFE9A8;border-radius:4px;padding:0 2px}
.ai-bubble{border:1.5px solid var(--line);border-radius:18px;padding:11px 13px;background:#fff;box-shadow:var(--shadow);font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.ai-bubble.me{background:var(--ink);color:#fff;border-color:var(--ink);margin-left:34px}
.ai-bubble.bot{margin-right:22px;background:linear-gradient(180deg,#FFFDF6,#fff)}
.ai-bubble h4{margin:8px 0 2px;font-size:13.5px}
.ai-bubble code{background:#F3ECDD;padding:1px 4px;border-radius:5px;font-size:12.5px}
.ai-bubble.bot pre{background:#F7F1E5;border:1.5px solid var(--line-soft);border-radius:12px;padding:9px;overflow:auto;font-size:12px;margin:7px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:6px 4px;border-bottom:1.5px solid var(--line-soft)}
table.tbl td{padding:7px 4px;border-bottom:1.5px dashed var(--line-soft)}
table.tbl tr:last-child td{border-bottom:none}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{width:12px;height:12px;border-radius:3.5px;background:#EFE7DA;border:1px solid rgba(34,28,23,.14)}
.heat i[data-l="1"]{background:#CFE8D4}.heat i[data-l="2"]{background:#9FDFB1}
.heat i[data-l="3"]{background:#6FC894}.heat i[data-l="4"]{background:#3E9A62}
.srcbox{background:var(--paper-2);border:1.5px dashed var(--line-soft);border-radius:var(--r-md);padding:10px 12px;font-size:11.5px;color:var(--ink-2)}
.srcbox b{color:var(--ink)}
.note{font-size:11.5px;background:#FFF8E4;border:1.5px solid var(--line-soft);border-left:4px solid var(--sun);border-radius:10px;padding:8px 10px;color:var(--ink-2)}
.err-img{max-width:100%;border-radius:12px;border:1.5px solid var(--line);margin-top:6px}
.voice{width:100%;margin-top:6px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sticky-note{position:relative}
.banner{display:flex;gap:9px;align-items:flex-start;background:#FFF6D9;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.banner.info{background:#EAF3FF}
.banner.err{background:#FFECEA}
.kbd{font-family:ui-monospace,monospace;font-size:11px;background:#F3ECDD;border:1px solid var(--line-soft);border-radius:6px;padding:1px 5px}
/* inline UI icons keep a fixed size; chart SVGs size themselves via attributes */
.card-h h3 svg,.sect-title svg,.btn svg,.st svg,.note svg,.banner svg,.row .small svg,.xsmall svg{width:17px;height:17px;flex:0 0 auto;vertical-align:-2px}
.banner > svg:first-child{width:20px;height:20px;margin-top:2px}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(0,0,0,.25);border-top-color:#000}
@keyframes sp{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<div class="app" id="app"></div>
<noscript><div style="padding:20px">This tracker needs JavaScript.</div></noscript>

trigonometric-equations"}]},{"id":"math.c14.t1","name":"Inverse Trigonometric Functions","jm":true,"ja":true,"slug":"inverse-trigonometric-functions","subs":[{"id":"math.c14.t1.s0","name":"Inverse trigonometrical functions and their properties","jm":true,"ja":true,"slug":"inverse-trigonometrical-functions-and-their-properties"},{"id":"math.c14.t1.s1","name":"Inverse trigonometric functions (principal value only) and their elementary properties","jm":false,"ja":true,"slug":"inverse-trigonometric-functions-principal-value-only-and-their-elementary-properties"}]}],"srcJM":"Unit 14: Trigonometry","srcJA":"Trigonometry"}]}]};

<script>
/* ===== js/core.js ===== */
/* ==========================================================================
   core.js - utilities, storage, state, syllabus engine, analytics, insights, charts
   ========================================================================== */
(function (global) {
  'use strict';
  const App = (global.App = global.App || {});

  /* ------------------------------------------------------------------ util */
  const MS_DAY = 86400000;
  const util = (App.util = {
    uid(prefix) {
      return (prefix || 'id') + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
    },
    todayISO() { return util.iso(new Date()); },
    iso(d) {
      const x = d instanceof Date ? d : new Date(d);
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    },
    isoTime(d) {
      const x = d instanceof Date ? d : new Date(d);
      return util.iso(x) + 'T' + String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0');
    },
    parse(iso) {
      if (!iso) return null;
      const p = String(iso).split('-').map(Number);
      return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
    },
    addDays(iso, n) { const d = util.parse(iso) || new Date(); d.setDate(d.getDate() + n); return util.iso(d); },
    diffDays(a, b) { const x = util.parse(a), y = util.parse(b); if (!x || !y) return 0; return Math.round((y - x) / MS_DAY); },
    daysFromToday(iso) { return util.diffDays(util.todayISO(), iso); },
    weekday(iso) { const d = util.parse(iso); return d ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] : ''; },
    weekdayLong(iso) { const d = util.parse(iso); return d ? ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()] : ''; },
    fmtDate(iso, style) {
      const d = util.parse(iso); if (!d) return '';
      const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
      if (style === 'long') return util.weekdayLong(iso) + ', ' + d.getDate() + ' ' + mon + ' ' + d.getFullYear();
      if (style === 'short') return d.getDate() + ' ' + mon;
      return d.getDate() + ' ' + mon + ' ' + d.getFullYear();
    },
    relDay(iso) {
      if (!iso) return '';
      const n = util.daysFromToday(iso);
      if (n === 0) return 'Today';
      if (n === 1) return 'Tomorrow';
      if (n === -1) return 'Yesterday';
      if (n < 0) return Math.abs(n) + 'd overdue';
      if (n <= 7) return 'in ' + n + 'd (' + util.weekday(iso) + ')';
      return util.fmtDate(iso, 'short');
    },
    minsToHM(m) {
      m = Math.max(0, Math.round(m || 0));
      const h = Math.floor(m / 60), mm = m % 60;
      if (!h) return mm + 'm';
      if (!mm) return h + 'h';
      return h + 'h ' + mm + 'm';
    },
    minsToClock(m) {
      m = Math.max(0, Math.round(m || 0));
      const h = Math.floor(m / 60), mm = m % 60, s = Math.floor((m * 60) % 60);
      return (h ? h + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(s).padStart(2, '0');
    },
    pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; },
    clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
    sum(arr, f) { return (arr || []).reduce((s, x) => s + (f ? f(x) : x), 0); },
    avg(arr, f) { return arr && arr.length ? util.sum(arr, f) / arr.length : 0; },
    round1(v) { return Math.round(v * 10) / 10; },
    groupBy(arr, f) { const o = {}; (arr || []).forEach(x => { const k = f(x); (o[k] = o[k] || []).push(x); }); return o; },
    esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
    clone(o) { try { return structuredClone(o); } catch (e) { return JSON.parse(JSON.stringify(o)); } },
    debounce(fn, ms) { let t; return function () { const a = arguments, self = this; clearTimeout(t); t = setTimeout(() => fn.apply(self, a), ms || 200); }; },
    sortBy(arr, f, dir) { const d = dir === 'desc' ? -1 : 1; return (arr || []).slice().sort((a, b) => { const x = f(a), y = f(b); return x < y ? -d : x > y ? d : 0; }); },
    uniq(arr) { return Array.from(new Set(arr || [])); },
    download(name, text, mime) {
      try {
        const blob = new Blob([text], { type: mime || 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
        return true;
      } catch (e) { return false; }
    },
    readFile(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result || ''));
        r.onerror = () => rej(r.error);
        r.readAsText(file);
      });
    },
    readDataURL(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result || ''));
        r.onerror = () => rej(r.error);
        r.readAsDataURL(file);
      });
    },
    nowISO() { return new Date().toISOString(); },
    idFromHash() { return (location.hash || '').replace(/^#\/?/, ''); },
    firstName(s) { return String(s || '').trim().split(/\s+/)[0] || ''; }
  });

  /* --------------------------------------------------------------- storage */
  const Store = (App.store = {
    KEY: 'jee-tracker-v1',
    BK: 'jee-tracker-backup-',
    available: false,
    memory: {},
    _subs: [],
    _saveT: null,
    probe() {
      try {
        const k = '__jt_probe';
        global.localStorage.setItem(k, '1');
        global.localStorage.removeItem(k);
        Store.available = true;
      } catch (e) { Store.available = false; }
      return Store.available;
    },
    rawGet(k) {
      try { return Store.available ? global.localStorage.getItem(k) : (Store.memory[k] || null); }
      catch (e) { return Store.memory[k] || null; }
    },
    rawSet(k, v) {
      try { if (Store.available) { global.localStorage.setItem(k, v); return true; } } catch (e) { Store.available = false; }
      Store.memory[k] = v; return false;
    },
    rawRemove(k) {
      try { if (Store.available) global.localStorage.removeItem(k); } catch (e) { }
      delete Store.memory[k];
    },
    defaultState() {
      return {
        v: 1,
        created: util.nowISO(),
        updated: util.nowISO(),
        profile: {
          name: '',
          examLabel: 'JEE 2027',
          mainDate: '2027-01-22',
          advancedDate: '2027-05-17',
          dailyTargetMin: 420
        },
        settings: { apiKey: '', model: 'gemini-2.5-flash', sample: false, showCoachTips: true },
        progress: {},
        lectures: [], revisions: [], tasks: [], questions: [], errors: [], tests: [], sessions: [],
        ai: { chats: [], activeChat: null, lastAnalysis: null },
        timer: { running: false, startedAt: null, mode: 'Lecture', subject: 'Physics', chapterId: '', topicId: '', exam: 'jm' },
        meta: { lastSweep: null, onboarded: false }
      };
    },
    state: null,
    load() {
      Store.probe();
      let s = null;
      const raw = Store.rawGet(Store.KEY);
      if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
      const def = Store.defaultState();
      if (!s || typeof s !== 'object') s = def;
      // shallow-merge new top-level keys
      Object.keys(def).forEach(k => { if (s[k] === undefined || s[k] === null) s[k] = def[k]; });
      s.profile = Object.assign({}, def.profile, s.profile || {});
      s.settings = Object.assign({}, def.settings, s.settings || {});
      s.ai = Object.assign({}, def.ai, s.ai || {});
      s.timer = Object.assign({}, def.timer, s.timer || {});
      s.meta = Object.assign({}, def.meta, s.meta || {});
      ['progress', 'lectures', 'revisions', 'tasks', 'questions', 'errors', 'tests', 'sessions'].forEach(k => {
        if (!s[k] || typeof s[k] !== 'object') s[k] = def[k];
      });
      Store.state = s;
      return s;
    },
    save(now) {
      Store.state.updated = util.nowISO();
      const write = () => { Store.rawSet(Store.KEY, JSON.stringify(Store.state)); };
      if (now) { clearTimeout(Store._saveT); write(); return; }
      clearTimeout(Store._saveT);
      Store._saveT = setTimeout(write, 250);
    },
    update(fn, opts) {
      const r = fn(Store.state);
      Store.save(opts && opts.now);
      Store.emit();
      return r;
    },
    subscribe(fn) { Store._subs.push(fn); return () => { Store._subs = Store._subs.filter(f => f !== fn); }; },
    emit() { Store._subs.forEach(f => { try { f(Store.state); } catch (e) { } }); },
    exportJSON() {
      return JSON.stringify({ app: 'jee-pcm-tracker', exportedAt: util.nowISO(), state: Store.state }, null, 1);
    },
    importJSON(text) {
      const parsed = JSON.parse(text);
      const st = parsed && parsed.state ? parsed.state : parsed;
      if (!st || typeof st !== 'object' || !st.profile) throw new Error('Not a valid tracker backup file.');
      const def = Store.defaultState();
      Object.keys(def).forEach(k => { if (st[k] === undefined) st[k] = def[k]; });
      Store.state = st;
      Store.save(true);
      Store.emit();
      return true;
    },
    backup(slot) {
      const key = Store.BK + slot;
      const payload = JSON.stringify({ at: util.nowISO(), state: Store.state });
      const ok = Store.rawSet(key, payload);
      return { slot, at: util.nowISO(), ok, size: payload.length };
    },
    backups() {
      const out = [];
      for (let i = 1; i <= 3; i++) {
        const raw = Store.rawGet(Store.BK + i);
        if (raw) { try { const p = JSON.parse(raw); out.push({ slot: i, at: p.at, size: raw.length }); } catch (e) { out.push({ slot: i, at: null, size: raw.length, broken: true }); } }
        else out.push({ slot: i, at: null, size: 0 });
      }
      return out;
    },
    restore(slot) {
      const raw = Store.rawGet(Store.BK + slot);
      if (!raw) throw new Error('That backup slot is empty.');
      return Store.importJSON(raw);
    },
    wipe(keepSettings) {
      const keep = keepSettings ? { profile: Store.state.profile, settings: Store.state.settings } : null;
      Store.state = Store.defaultState();
      if (keep) { Store.state.profile = keep.profile; Store.state.settings = keep.settings; }
      Store.save(true);
      Store.emit();
    }
  });

  /* ------------------------------------------------------- syllabus engine */
  const EXAM = (App.EXAM = { jm: { key: 'jm', label: 'JEE Main', short: 'JM', long: 'JEE Main' }, ja: { key: 'ja', label: 'JEE Advanced', short: 'JA', long: 'JEE Advanced' } });

  const Syl = (App.syl = {
    data: null,
    subjects: [],
    byCode: {},
    index: {},
    init(data) {
      Syl.data = data;
      Syl.subjects = data.subjects;
      Syl.index = {};
      data.subjects.forEach(sub => {
        data.subjects.forEach(() => { });
        sub.chapters.forEach(ch => {
          const chRec = { kind: 'chapter', node: ch, chapter: ch, topic: null, subject: sub, name: ch.name };
          Syl.index[ch.id] = chRec;
          ch.topics.forEach(tp => {
            const tpRec = { kind: 'topic', node: tp, chapter: ch, topic: tp, subject: sub, name: tp.name };
            Syl.index[tp.id] = tpRec;
            tp.subs.forEach(sb => {
              Syl.index[sb.id] = { kind: 'sub', node: sb, chapter: ch, topic: tp, subject: sub, name: sb.name };
            });
          });
        });
      });
      data.subjects.forEach(s => { Syl.byCode[s.code] = s; });
      return Syl;
    },
    rec(id) { return Syl.index[id] || null; },
    subjectOf(id) { const r = Syl.index[id]; return r ? r.subject : null; },
    chapterOf(id) { const r = Syl.index[id]; return r ? r.chapter : null; },
    topicOf(id) { const r = Syl.index[id]; if (!r) return null; return r.topic || null; },
    chapter(id) { const r = Syl.index[id]; return r ? r.chapter : null; },
    leaves(nodeId, exam) {
      const r = Syl.index[nodeId];
      if (!r) return [];
      let arr = [];
      if (r.kind === 'sub') arr = [r.node];
      else if (r.kind === 'topic') arr = r.topic.subs;
      else arr = r.chapter.topics.reduce((a, t) => a.concat(t.subs), []);
      if (exam) arr = arr.filter(x => x[exam]);
      return arr;
    },
    topicLeaves(topicId, exam) { return Syl.leaves(topicId, exam); },
    inScope(node, exam) { return !exam ? true : !!node[exam]; },
    // search over syllabus
    search(q) {
      const s = String(q || '').toLowerCase().trim();
      if (!s) return { chapters: [], topics: [], subs: [] };
      const hit = t => String(t).toLowerCase().indexOf(s) >= 0;
      const res = { chapters: [], topics: [], subs: [] };
      Syl.subjects.forEach(sub => sub.chapters.forEach(ch => {
        if (hit(ch.name)) res.chapters.push({ id: ch.id, name: ch.name, subject: sub.name, code: sub.code });
        ch.topics.forEach(tp => {
          if (hit(tp.name)) res.topics.push({ id: tp.id, name: tp.name, chapter: ch.name, subject: sub.name, code: sub.code, chapterId: ch.id });
          tp.subs.forEach(sb => { if (hit(sb.name)) res.subs.push({ id: sb.id, name: sb.name, topic: tp.name, chapter: ch.name, subject: sub.name, code: sub.code, topicId: tp.id, chapterId: ch.id }); });
        });
      }));
      return res;
    },
    counts(exam) {
      let chapters = 0, topics = 0, subs = 0, leavesPerSubject = {};
      Syl.subjects.forEach(sub => {
        let n = 0;
        sub.chapters.forEach(ch => { chapters++; ch.topics.forEach(tp => { topics++; tp.subs.forEach(sb => { subs++; if (Syl.inScope(sb, exam)) n++; }); }); });
        if (exam) {
          // chapter counts only where chapter has at least one leaf in scope
          chapters = chapters;
        }
        leavesPerSubject[sub.code] = n;
      });
      return { chapters, topics, subs, leavesPerSubject };
    }
  });

  /* --------------------------------------------------- progress + metrics */
  const DIMS = ['theory', 'lecture', 'dpp', 'pyq', 'practice'];
  const DIM_LABEL = { theory: 'Theory', lecture: 'Lecture', dpp: 'DPP', pyq: 'PYQ', practice: 'Practice', revision: 'Revision' };
  const STATUSES = [
    { key: 'not_started', label: 'Not Started' },
    { key: 'learning', label: 'Learning' },
    { key: 'completed', label: 'Completed' },
    { key: 'weak', label: 'Weak' },
    { key: 'revision_due', label: 'Revision Due' }
  ];
  const MISTAKE_TYPES = ['Conceptual', 'Calculation', 'Formula', 'Silly mistake', 'Misread question', 'Wrong approach', 'Time pressure', 'Guess'];
  const SOURCES = ['DPP', 'PYQ', 'Practice', 'Mock Test'];
  const TASK_TYPES = ['Lecture', 'Topic study', 'PYQ', 'DPP', 'Practice', 'Revision', 'Mock test', 'Error-book revision'];

  const Prog = (App.prog = {
    DIMS, DIM_LABEL, STATUSES, MISTAKE_TYPES, SOURCES, TASK_TYPES,
    norm(exam) { return exam === 'ja' ? 'ja' : 'jm'; },
    blank() { return { status: 'not_started', weak: false, theory: 'none', lecture: 'none', dpp: 'none', pyq: 'none', practice: 'none', revisionCount: 0, lastStudied: null, timeMin: 0, note: '' }; },
    get(nodeId, exam) {
      const S = Store.state;
      exam = Prog.norm(exam);
      const rec = S.progress[nodeId] || (S.progress[nodeId] = {});
      let p = rec[exam];
      if (!p) { p = rec[exam] = Prog.blank(); }
      else {
        const b = Prog.blank();
        Object.keys(b).forEach(k => { if (p[k] === undefined) p[k] = b[k]; });
      }
      return p;
    },
    peek(nodeId, exam) {
      const S = Store.state;
      return (S.progress[nodeId] && S.progress[nodeId][Prog.norm(exam)]) || null;
    },
    set(nodeId, exam, patch, silent) {
      const p = Prog.get(nodeId, exam);
      Object.assign(p, patch);
      if (!silent) Store.save();
      return p;
    },
    /* leaves under a node (chapter/topic/sub) that exist in the given exam scope */
    scope(nodeId, exam) { return exam ? Syl.leaves(nodeId, exam) : Syl.leaves(nodeId, 'jm'); },
    /* is a revision scheduled/overdue for this leaf+exam? */
    revState(nodeId, exam) {
      exam = Prog.norm(exam);
      const due = [], over = [], up = [], done = [];
      Store.state.revisions.forEach(r => {
        if (r.nodeId !== nodeId || r.exam !== exam) return;
        if (r.completedAt) { done.push(r); return; }
        const d = util.daysFromToday(r.scheduledFor);
        if (d < 0) over.push(r); else if (d === 0) due.push(r); else up.push(r);
      });
      return {
        due, over, up, done,
        dueToday: due.length, overdue: over.length, upcoming: up.length, completed: done.length,
        next: (due[0] || up[0] || null)
      };
    },
    /* status shown to the user: stored status, upgraded to revision_due when a revision is pending */
    displayStatus(nodeId, exam) {
      const p = Prog.peek(nodeId, exam);
      const st = p ? p.status : 'not_started';
      const rv = Prog.revState(nodeId, exam);
      if (st !== 'not_started' && (rv.dueToday > 0 || rv.overdue > 0)) return 'revision_due';
      if (p && p.weak) return 'weak';
      return st;
    },
    /* aggregated coverage of one leaf, 0..1 */
    leafCoverage(nodeId, exam) {
      exam = Prog.norm(exam);
      const p = Prog.get(nodeId, exam);
      const w = { theory: .22, lecture: .24, dpp: .2, pyq: .18, practice: .16 };
      let s = 0;
      DIMS.forEach(d => { const v = p[d] === 'done' ? 1 : p[d] === 'partial' ? .5 : 0; s += v * w[d]; });
      const rev = util.clamp(p.revisionCount / 3, 0, 1) * .12;
      return util.clamp(s * (1 - .12) + rev, 0, 1);
    },
    /* questions logged against a node or its children */
    qstats(nodeId, exam) {
      exam = exam === 'ja' ? 'ja' : exam === 'jm' ? 'jm' : null;
      const ids = {};
      const r = Syl.index[nodeId];
      if (!r) return { attempted: 0, correct: 0, wrong: 0, unattempted: 0, accuracy: 0, timeMin: 0, count: 0, bySource: {} };
      if (r.kind === 'sub') ids[nodeId] = 1;
      else if (r.kind === 'topic') { ids[nodeId] = 1; r.topic.subs.forEach(s => ids[s.id] = 1); }
      else { ids[nodeId] = 1; r.chapter.topics.forEach(t => { ids[t.id] = 1; t.subs.forEach(s => ids[s.id] = 1); }); }

  /* ------------------------------------------------------ topic dimension */
  F.topicDimensions = function (nodeId, exam) {
    const rec = Syl.rec(nodeId);
    if (!rec) return;
    const p = Prog.get(nodeId, exam);
    const scopeNote = rec.kind === 'sub' ? rec.name : rec.name + ' (applies to all ' + Prog.scope(nodeId, exam).length + ' subtopics in the ' + (exam === 'jm' ? 'Main' : 'Advanced') + ' scope)';
    const dim = (key, label, opts) => B.field(label, B.seg('dim_' + key, opts, p[key]));
    const html =
      '<div class="note" style="margin-bottom:10px">' + U.esc(scopeNote) + '</div>' +
      B.field('Overall status', B.seg('status', Prog.STATUSES.map(s => ({ value: s.key, label: s.label })), Prog.displayStatus(nodeId, exam))) +
      dim('theory', 'Theory', [{ value: 'none', label: 'Not done' }, { value: 'partial', label: 'Partial' }, { value: 'done', label: 'Done' }]) +
      dim('lecture', 'Lecture', [{ value: 'none', label: 'Not done' }, { value: 'partial', label: 'Partial' }, { value: 'done', label: 'Done' }]) +
      dim('dpp', 'DPP', [{ value: 'none', label: 'Not done' }, { value: 'partial', label: 'Partial' }, { value: 'done', label: 'Done' }]) +
      dim('pyq', 'PYQ', [{ value: 'none', label: 'Not done' }, { value: 'partial', label: 'Partial' }, { value: 'done', label: 'Done' }]) +
      dim('practice', 'Practice', [{ value: 'none', label: 'Not done' }, { value: 'partial', label: 'Partial' }, { value: 'done', label: 'Done' }]) +
      B.field('Revisions completed', '<input type="number" name="revisionCount" min="0" max="20" value="' + (p.revisionCount || 0) + '">') +
      B.field('Mark weak', B.seg('weak', [{ value: 'no', label: 'No' }, { value: 'yes', label: 'Yes' }], p.weak ? 'yes' : 'no')) +
      B.field('Personal note', '<textarea name="note">' + U.esc(p.note || '') + '</textarea>') +
      '<div class="grid2">' +
      B.kpi('Coverage', Prog.leafCoverage(nodeId, exam) * 100 >= 0 ? Math.round(Prog.leafCoverage(nodeId, exam) * 100) + '%' : '0%', 'weighted dimensions') +
      B.kpi('Mastery', Prog.mastery(nodeId, exam) + '%', 'coverage x accuracy') +
      '</div>';
    B.sheet({
      title: (exam === 'jm' ? 'JM' : 'JA') + ' tracking - ' + rec.name,
      html,
      footer: '<button class="btn primary block" data-act="save-dims">Save tracking</button>',
      onMount: function (body, sc) {
        body.querySelectorAll('[data-seg]').forEach(seg => {
          seg.addEventListener('click', e => {
            const b = e.target.closest('[data-segval]'); if (!b) return;
            seg.querySelectorAll('.pill').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            const hidden = seg.parentElement.querySelector('input[type="hidden"][name="' + seg.getAttribute('data-seg') + '"]');
            if (hidden) hidden.value = b.getAttribute('data-segval');
          });
        });
        sc.querySelector('[data-act="save-dims"]').addEventListener('click', () => {
          const v = B.formValues(body);
          const leaves = Prog.scope(nodeId, exam);
          const patch = {
            status: v.status, theory: v.dim_theory, lecture: v.dim_lecture, dpp: v.dim_dpp, pyq: v.dim_pyq,
            practice: v.dim_practice, weak: v.weak === 'yes', note: v.note || '',
            revisionCount: +v.revisionCount || 0, lastStudied: U.todayISO()
          };
          S.update(st => {
            leaves.forEach(l => {
              const rec2 = st.progress[l.id] = st.progress[l.id] || {};
              const target = rec2[exam] = rec2[exam] || Prog.blank();
              const merged = Object.assign({}, patch);
              if (leaves.length > 1) merged.revisionCount = Math.max(target.revisionCount || 0, patch.revisionCount);
              Object.assign(target, merged);
            });
          });
          if (v.status === 'completed' && S.state.settings.autoRevision !== false) ensureRevisions(leaves, exam);
          B.closeSheet(); App.refresh(); App.toast('Tracking saved for ' + (exam === 'jm' ? 'JEE Main' : 'JEE Advanced'));
        });
      }
    });
  };

  /* --------------------------------------------------------- revision flow */
  function ensureRevisions(leaves, exam) {
    const created = [];
    leaves.forEach(l => {
      const existing = S.state.revisions.filter(r => r.nodeId === l.id && r.exam === exam && !r.completedAt);
      if (existing.length) return;
      const rec = Syl.rec(l.id);
      const p = Prog.get(l.id, exam);
      const idx = (p.revisionCount || 0) + 1;
      const due = Calc.nextRevisionDate(l.id, exam, idx - 1);
      created.push({ l, idx, due, rec });
    });
    if (!created.length) return;
    S.update(st => created.forEach(c => st.revisions.push({
      id: U.uid('rev'), nodeId: c.l.id, topicId: c.rec.topic ? c.rec.topic.id : c.rec.chapter.id,
      topicName: c.rec.topic ? c.rec.topic.name : c.rec.chapter.name, chapterName: c.rec.chapter.name,
      subject: c.rec.subject.name, exam, index: c.idx, scheduledFor: c.due, completedAt: null, auto: true, createdAt: U.nowISO()
    })));
    App.toast('Revision ' + created[0].idx + ' scheduled for ' + U.fmtDate(created[0].due, 'short') + (created.length > 1 ? ' (+' + (created.length - 1) + ' more)' : ''));
  }
  App.ensureRevisions = ensureRevisions;

  function logTimeFor(nodeId, exam, minutes) {
    if (!minutes) return;
    const rec = Syl.rec(nodeId);
    if (!rec) return;
    const leaves = rec.kind === 'sub' ? [rec.node] : Prog.scope(nodeId, exam);
    S.update(st => {
      const per = Math.round(minutes / Math.max(1, leaves.length));
      leaves.forEach(l => {
        const r = st.progress[l.id] = st.progress[l.id] || {};
        const p = r[exam] = r[exam] || Prog.blank();
        p.timeMin = (p.timeMin || 0) + per;
        p.lastStudied = U.todayISO();
      });
    }, { now: false });
  }
  App.logTimeFor = logTimeFor;

  /* ------------------------------------------------------------- mutations */
  const M = (App.mut = {});
  M.taskDone = function (id) {
    S.update(st => { const t = st.tasks.find(x => x.id === id); if (t) { t.status = 'done'; t.completedAt = U.nowISO(); t.inBacklog = false; } });
    App.refresh(); App.toast('Task completed');
  };
  M.taskUndone = function (id) {
    S.update(st => { const t = st.tasks.find(x => x.id === id); if (t) { t.status = 'pending'; t.completedAt = null; } });
    App.refresh();
  };
  M.taskDelete = function (id) {
    B.confirm('Delete this task? Backlog items are normally rescheduled instead.', () => {
      S.update(st => { st.tasks = st.tasks.filter(x => x.id !== id); });
      App.refresh(); App.toast('Task deleted');
    });
  };
  M.taskReschedule = function (id) {
    const t = S.state.tasks.find(x => x.id === id); if (!t) return;
    B.sheet({
      title: 'Reschedule task',
      html: B.field('New date', '<input type="date" name="d" value="' + U.todayISO() + '">') + '<div class="note">' + U.esc(t.title) + '</div>',
      footer: '<button class="btn primary block" data-act="do-resched">Move task</button>',
      onMount: (body, sc) => sc.querySelector('[data-act="do-resched"]').addEventListener('click', () => {
        const d = body.querySelector('[name="d"]').value;
        S.update(st => { const x = st.tasks.find(y => y.id === id); if (x) { x.plannedFor = d; x.inBacklog = false; x.backlogSince = null; } });
        B.closeSheet(); App.refresh(); App.toast('Rescheduled to ' + U.fmtDate(d, 'short'));
      })
    });
  };
  M.taskSplit = function (id) {
    const t = S.state.tasks.find(x => x.id === id); if (!t) return;
    B.sheet({
      title: 'Split task',
      html: '<div class="note" style="margin-bottom:10px">' + U.esc(t.title) + ' &middot; ' + (t.estMin || 45) + ' min</div>' +
        B.field('Split into how many parts?', B.select('parts', [{ value: '2', label: '2 parts' }, { value: '3', label: '3 parts' }, { value: '4', label: '4 parts' }], '2')) +
        B.field('Schedule part 1 on', '<input type="date" name="from" value="' + U.todayISO() + '">') +
        '<div class="hint">Each part is scheduled on consecutive days, one after another.</div>',
      footer: '<button class="btn primary block" data-act="do-split">Split task</button>',
      onMount: (body, sc) => sc.querySelector('[data-act="do-split"]').addEventListener('click', () => {
        const parts = +body.querySelector('[name="parts"]').value || 2;
        const from = body.querySelector('[name="from"]').value;
        const each = Math.max(5, Math.round((t.estMin || 45) / parts));
        S.update(st => {
          const orig = st.tasks.find(x => x.id === id);
          if (orig) { orig.inBacklog = false; orig.estMin = each; orig.plannedFor = from; orig.title = orig.title.replace(/ \(part \d+\)$/, '') + ' (part 1)'; orig.splitFrom = id; }
          for (let i = 1; i < parts; i++) {
            st.tasks.push(Object.assign({}, t, {
              id: U.uid('task'), title: (t.title || '').replace(/ \(part \d+\)$/, '') + ' (part ' + (i + 1) + ')',
              plannedFor: U.addDays(from, i), estMin: each, inBacklog: false, status: 'pending', completedAt: null
            }));
          }
        });
        B.closeSheet(); App.refresh(); App.toast('Task split into ' + parts + ' parts');
      })
    });
  };
  M.revisionDone = function (id) {
    S.update(st => {
      const r = st.revisions.find(x => x.id === id); if (!r) return;
      r.completedAt = U.nowISO();
      const rec = Syl.rec(r.nodeId);
      const leaves = rec ? (rec.kind === 'sub' ? [rec.node] : Prog.scope(r.nodeId, r.exam)) : [];
      leaves.forEach(l => {
        const rr = st.progress[l.id] = st.progress[l.id] || {};
        const p = rr[r.exam] = rr[r.exam] || Prog.blank();
        p.revisionCount = Math.max(p.revisionCount || 0, r.index);
        p.lastStudied = U.todayISO();
        p.lastRevision = U.todayISO();
      });
    }, { now: true });
    // schedule the next revision in the sequence
    const r = S.state.revisions.find(x => x.id === id);
    if (r && r.index < 5) {
      const rec = Syl.rec(r.nodeId);
      S.update(st => st.revisions.push({
        id: U.uid('rev'), nodeId: r.nodeId, topicId: r.topicId, topicName: r.topicName, chapterName: r.chapterName,
        subject: r.subject, exam: r.exam, index: r.index + 1,
        scheduledFor: Calc.nextRevisionDate(r.nodeId, r.exam, r.index), completedAt: null, auto: true, createdAt: U.nowISO()
      }));
    }
    App.refresh(); App.toast('Revision ' + (r ? r.index : '') + ' completed' + (r && r.index < 5 ? ' - revision ' + (r.index + 1) + ' scheduled' : ''));
  };
  M.revisionReschedule = function (id) {
    const r = S.state.revisions.find(x => x.id === id); if (!r) return;
    B.sheet({
      title: 'Reschedule revision',
      html: B.field('New date', '<input type="date" name="d" value="' + U.todayISO() + '">') + '<div class="note">' + U.esc((r.topicName || '') + ' - Revision ' + r.index) + '</div>',
      footer: '<button class="btn primary block" data-act="do-resched-rev">Move revision</button>',
      onMount: (body, sc) => sc.querySelector('[data-act="do-resched-rev"]').addEventListener('click', () => {
        const d = body.querySelector('[name="d"]').value;
        S.update(st => { const x = st.revisions.find(y => y.id === id); if (x) x.scheduledFor = d; });
        B.closeSheet(); App.refresh(); App.toast('Revision moved to ' + U.fmtDate(d, 'short'));
      })
    });
  };
  M.revisionDelete = function (id) {
    S.update(st => { st.revisions = st.revisions.filter(x => x.id !== id); });
    App.refresh(); App.toast('Revision removed');
  };
  M.lectureStatus = function (id, status) {
    S.update(st => { const l = st.lectures.find(x => x.id === id); if (l) { l.status = status; if (status === 'Completed') l.watchedMin = l.duration || l.watchedMin; } });
    App.refresh();
  };
  M.errorStatus = function (id, status) {
    S.update(st => {
      const e0 = st.errors.find(x => x.id === id); if (!e0) return;
      e0.status = status;
      if (status !== 'open') { e0.revisions = (e0.revisions || 0) + 1; e0.lastRevised = U.todayISO(); }
    });
    App.refresh(); App.toast('Error book updated');
  };
  M.errorDelete = function (id) {
    B.confirm('Delete this error entry?', () => { S.update(st => { st.errors = st.errors.filter(x => x.id !== id); }); App.refresh(); });
  };
  M.quickStatus = function (nodeId, exam, status) {
    const leaves = Prog.scope(nodeId, exam);
    S.update(st => leaves.forEach(l => {
      const rec = st.progress[l.id] = st.progress[l.id] || {};
      const p = rec[exam] = rec[exam] || Prog.blank();
      p.status = status;
      if (status === 'completed' && p.theory === 'none') p.theory = 'done';
      if (status === 'not_started') { p.theory = 'none'; p.weak = false; }
    }));
    if (status === 'completed' && S.state.settings.autoRevision !== false) ensureRevisions(leaves, exam);
    App.refresh(); App.toast((Syl.rec(nodeId) ? Syl.rec(nodeId).name : 'Topic') + ' marked ' + status.replace('_', ' ') + ' (' + (exam === 'jm' ? 'JM' : 'JA') + ')');
  };
  M.deleteEntity = function (kind, id) {
    S.update(st => { if (st[kind]) st[kind] = st[kind].filter(x => x.id !== id); });
    App.refresh();
  };
})(typeof window !== 'undefined' ? window : globalThis);

  /* ============================================================ SYLLABUS */
  Sc.syllabus = function (parts) {

    const exam = B.scope;
    const f = B.filters.syllabus = B.filters.syllabus || { status: 'all', q: '' };
    let html = '<div class="chips">' + Syl.subjects.map(s =>
      '<a class="pill ' + (s.code === code ? 'on' : '') + '" href="#/syllabus/' + s.code + '">' + U.esc(s.name) + '</a>').join('') + '</div>';
    html += scopeSeg();
    const st = Calc.subjectStats(code, exam);
    html += '<div class="card ' + B.subjectTint(code) + '">' +
      '<div class="between"><div>' +
      '<div class="bold" style="font-size:16px">' + U.esc(sub.name) + ' syllabus</div>' +
      '<div class="xsmall muted">' + st.leaves + ' subtopics in scope &middot; ' + st.chapters + ' chapters</div></div>' +
      B.ring(st.pct, { size: 66, stroke: 9, color: code === 'phy' ? '#7FA8E8' : code === 'chem' ? '#6FC894' : '#EE9E52' }) + '</div>' +
      '<div class="hr"></div>' +
      '<div class="grid3">' + B.kpi('JM', st.jmPct + '%', 'Main coverage') + B.kpi('JA', st.jaPct + '%', 'Advanced coverage') + B.kpi('Mastery', st.mastery + '%', 'accuracy-adjusted') + '</div>' +
      '<div class="xsmall muted" style="margin-top:8px">' + st.done + ' completed &middot; ' + (st.leaves - st.done) + ' remaining &middot; ' + st.weak + ' weak &middot; ' + st.revDue + ' revision due</div>' +
      '</div>';

    html += '<div class="chips">' +
      ['all', 'remaining', 'weak', 'revision_due', 'completed'].map(k => '<button class="pill tap ' + (f.status === k ? 'on' : '') + '" data-act="syl-filter" data-v="' + k + '">' +
        ({ all: 'All chapters', remaining: 'Remaining', weak: 'Weak', revision_due: 'Revision due', completed: 'Completed' })[k] + '</button>').join('') +
      '<a class="pill" href="#/topics-left">Topics Left &rsaquo;</a></div>';

    html += sub.chapters.map(ch => {
      const a = Prog.agg(ch.id, exam);
      const jma = Prog.agg(ch.id, 'jm'), jaa = Prog.agg(ch.id, 'ja');
      const status = Prog.statusOfAgg(ch.id, exam);
      if (f.status === 'remaining' && a.remaining === 0) return '';
      if (f.status === 'completed' && a.pct < 100) return '';
      if (f.status === 'weak' && a.weak === 0) return '';
      if (f.status === 'revision_due' && a.revDue === 0) return '';
      const open = !!B.exp[ch.id];
      return '<div class="acc ' + (open ? 'open' : '') + '">' +
        '<div class="acc-h" data-act="toggle-exp" data-id="' + ch.id + '">' +
        '<div style="flex:0 0 auto">' + B.ring(a.pct, { size: 44, stroke: 6, color: code === 'phy' ? '#7FA8E8' : code === 'chem' ? '#6FC894' : '#EE9E52' }) + '</div>' +
        '<div style="flex:1;min-width:0">' +
        '<div class="t bold" style="font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">' + U.esc(ch.name) + B.badges(ch) + '</div>' +
        '<div class="xsmall muted">' + (ch.unit ? U.esc(ch.unit) + ' &middot; ' : '') + a.completed + '/' + a.total + ' done &middot; ' + a.remaining + ' left &middot; mastery ' + a.mastery + '%</div>' +
        '<div class="row" style="gap:6px;margin-top:5px"><span class="xsmall bold" style="color:#6E9BE0">JM ' + jma.pct + '%</span><span class="xsmall bold" style="color:#E48BA8">JA ' + jaa.pct + '%</span>' +
        (a.weak ? '<span class="xsmall bold" style="color:#C0503F">' + a.weak + ' weak</span>' : '') +
        (a.revDue ? '<span class="xsmall bold" style="color:#7A5BC7">' + a.revDue + ' rev due</span>' : '') + '</div>' +
        '<div class="pbar thin" style="margin-top:5px"><i style="width:' + a.pct + '%"></i></div>' +
        '</div>' +
        '<span class="chev">' + I.chev + '</span></div>' +
        '<div class="acc-b">' +
        '<div class="grid3" style="margin-top:9px">' +
        B.kpi('Questions', a.questions.attempted, a.questions.accuracy + '% accuracy') +
        B.kpi('Lectures', a.lectures.done + '/' + a.lectures.total, U.minsToHM(a.lectures.watched) + ' watched') +
        B.kpi('Revisions', a.revisionCount, a.revDue + ' due now') +
        '</div>' +
        '<div class="row between" style="margin:12px 0 4px"><span class="xsmall bold">Topics</span><a class="xsmall bold" href="#/chapter/' + ch.id + '">Chapter performance &rsaquo;</a></div>' +
        ch.topics.map(tp => {
          const ta = Prog.agg(tp.id, exam);
          const subOpen = !!B.exp[tp.id];
          return '<div class="topicrow" data-act="toggle-exp" data-id="' + tp.id + '" style="flex-direction:column;align-items:stretch">' +
            '<div class="row" style="gap:8px;align-items:center">' +
            B.dot(ta.pct === 100 ? 'completed' : 'learning') +
            '<div style="flex:1;min-width:0"><div class="bold small">' + U.esc(tp.name) + ' ' + B.badges(tp) + '</div>' +
            '<div class="xsmall muted">' + ta.completed + '/' + ta.total + ' done &middot; ' + ta.mastery + '% mastery' + (ta.questions.attempted ? ' &middot; ' + ta.questions.accuracy + '% acc' : '') + '</div></div>' +
            '<div class="mini-bar"><i style="width:' + ta.pct + '%"></i></div>' +
            '<span class="chev" style="transform:' + (subOpen ? 'rotate(90deg)' : 'none') + '">' + I.chev + '</span></div>' +
            (subOpen ? '<div style="margin-top:6px">' + tp.subs.map(sb => {
              const status = Prog.displayStatus(sb.id, exam);
              return '<div class="subrow">' + B.dot(status) +
                '<div class="nm">' + U.esc(sb.name) + ' ' + B.badges(sb) + '</div>' +
                '<div class="row" style="gap:4px">' + Prog.STATUSES.map(s => '<button class="pill ' + (status === s.key ? 'on' : '') + '" style="padding:2px 6px;font-size:10px" data-act="quick-status" data-id="' + sb.id + '" data-status="' + s.key + '" title="' + s.label + '">' + s.label.slice(0, 3) + '</button>').join('') + '</div></div>';
            }).join('') +
              '<div class="btnrow" style="margin-top:8px"><button class="btn sm" data-act="open-topic" data-id="' + tp.id + '">Track topic (JM/JA)</button>' +
              '<button class="btn sm" data-act="nav" data-href="#/chapter/' + ch.id + '">Chapter dashboard</button></div>' : '') +
            '</div>';
        }).join('') +
        '</div></div>';
    }).join('');

    html += '<div class="srcbox">Sources &mdash; JM: ' + U.esc(sub.chapters.find(c => c.srcJM) ? '' : '') + ' <b>' + U.esc(Syl.data.meta.mainSource) + '</b>. JA: <b>' + U.esc(Syl.data.meta.advancedSource) + '</b>. <a href="#/profile/provenance"><b>Details &rsaquo;</b></a></div>';
    return { title: 'Syllabus', sub: 'official JEE Main &amp; Advanced topics', html };
  };
  B.action('toggle-exp', el => { const id = el.getAttribute('data-id'); B.exp[id] = !B.exp[id]; App.refresh(); });
  B.action('syl-filter', el => { B.filters.syllabus.status = el.getAttribute('data-v'); App.refresh(); });
  B.action('quick-status', el => App.mut.quickStatus(el.getAttribute('data-id'), B.scope, el.getAttribute('data-status')));
  B.action('open-topic', el => { location.hash = '#/topic/' + el.getAttribute('data-id'); });

  /* =========================================================== CHAPTER */

      '<div class="between"><div><div class="xsmall bold muted">' + U.esc(cs.chapter.unit || '') + '</div>' +
      '<div class="bold" style="font-size:17px">' + U.esc(ch.name) + ' ' + B.badges(ch) + '</div></div>' +
      B.ring(a.pct, { size: 68, stroke: 9 }) + '</div>' +
      '<div class="hr"></div>' +
      '<div class="grid3">' +
      B.kpi('In scope', a.pct + '%', a.completed + '/' + a.total + ' ' + (exam === 'jm' ? 'JM' : 'JA')) +

      B.kpi('Weak', a.weak, 'flagged') + '</div>' +
      '</div>';

      '<div class="row wrap" style="gap:9px">' +
      B.kpi('Lecture completion', a.lectures.total ? Math.round(a.lectures.done / a.lectures.total * 100) + '%' : '-', a.lectures.done + '/' + a.lectures.total + ' lectures') +
      B.kpi('Questions solved', a.questions.attempted, a.questions.sessions + ' logs') +
      B.kpi('PYQs solved', a.questions.bySource.PYQ || 0, 'PYQ source') +
      B.kpi('Accuracy', a.questions.accuracy + '%', a.questions.wrong + ' wrong') +
      B.kpi('Revisions', a.revisionCount, a.revDue + ' due now') +
      B.kpi('Errors logged', cs.errors.total, cs.errors.open + ' open') +
      B.kpi('Study time', U.minsToHM(cs.timeMin), 'from timer/sessions') +
      B.kpi('DPP solved', a.questions.bySource.DPP || 0, 'DPP source') +
      '</div></div>';
    html += '<div class="card"><div class="card-h"><h3>Topic breakdown</h3><span class="mini">mastery %</span></div>' +
      App.charts.hbars(cs.topics.map(t => ({
        label: t.name, value: t.mastery, valueText: t.mastery + '%  (' + t.completed + '/' + t.total + ')',
        color: t.mastery >= 70 ? '#6FC894' : t.mastery >= 40 ? '#FFD873' : '#F8A79F'
      }))) +
      '<div class="xsmall muted">Each row is that topic\'s accuracy-adjusted mastery, not just lecture completion.</div></div>';
    const dimRows = Prog.DIMS.map(d => {
      const dd = a.dims[d];

    });

    html += '<div class="card"><div class="card-h"><h3>Mistake patterns</h3></div>' +

        tp.subs.map(sb => '<div class="subrow">' + B.dot(Prog.displayStatus(sb.id, exam)) + '<div class="nm">' + U.esc(sb.name) + ' ' + B.badges(sb) + '</div>' +

    html += '<div class="btnrow"><button class="btn sm" data-act="fab-question">Log questions</button><button class="btn sm" data-act="fab-error">Log error</button>' +
      '<button class="btn sm primary" data-act="analyse-chapter" data-id="' + ch.id + '">' + I.spark + ' Analyze chapter with Gemini</button></div>';

  Sc.topic = function (parts) {
    const id = parts[0];
    const rec = Syl.rec(id);
    if (!rec) return { title: 'Topic', html: B.empty('Topic not found') };
    const exam = B.scope;
    const a = Prog.agg(id, exam);

  /* =============================================================== TESTS */
  Sc.tests = function () {
    const ts = Calc.testStats();
    let html = '<div class="card"><div class="card-h"><h3>' + I.chart + ' Mock test tracker</h3><button class="btn sm" data-act="fab-test">+ Test</button></div>' +
      (ts.tests.length ? '<div class="grid3">' + B.kpi('Tests', ts.tests.length, '') + B.kpi('Latest', ts.latest ? ts.latest.pct + '%' : '-', ts.latest ? ts.latest.score + '/' + ts.latest.maxMarks : '') +
        B.kpi('Best', ts.best ? ts.best.pct + '%' : '-', ts.best ? ts.best.name.slice(0, 18) : '') + '</div>' +
        (ts.delta != null ? '<div class="banner ' + (ts.delta >= 0 ? 'info' : 'err') + '" style="margin-top:10px">' +
          (ts.delta >= 0 ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 3 6-8"/><path d="M15 6h4v4"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l5 6 4-3 6 8"/><path d="M15 18h4v-4"/></svg>') +
          '<div>Latest test is <b>' + (ts.delta >= 0 ? '+' : '') + ts.delta + ' percentage points</b> compared with the previous test.</div></div>' : '')
        : B.empty('No mock tests logged yet.', '&#128203;')) + '</div>';
    if (ts.tests.length) {
      html += '<div class="card"><div class="card-h"><h3>Score trend</h3><span class="mini">% of max marks</span></div>' +
        App.charts.line(ts.tests.slice(-8).map(t => ({ label: U.fmtDate(t.date, 'short'), value: t.pct })), { max: 100, color: '#6E9BE0' }) + '</div>';
      html += '<div class="card"><div class="card-h"><h3>Subject-wise performance</h3></div>' +
        App.charts.hbars(Object.keys(ts.bySubject).map(k => ({ label: k === 'phy' ? 'Physics' : k === 'chem' ? 'Chemistry' : 'Mathematics', value: ts.bySubject[k].pct, valueText: ts.bySubject[k].score + '/' + ts.bySubject[k].max + ' (' + ts.bySubject[k].pct + '%)', color: k === 'phy' ? '#C3D8FA' : k === 'chem' ? '#BFE9CD' : '#FBD2A9' }))) + '</div>';
      html += ts.tests.slice().reverse().map(t => '<div class="card"><div class="between"><div><div class="bold">' + U.esc(t.name) + '</div>' +
        '<div class="xsmall muted">' + U.fmtDate(t.date, 'long') + ' &middot; ' + (t.exam === 'ja' ? 'JEE Advanced' : 'JEE Main') + ' pattern</div></div>' +
        '<div class="center"><div class="count" style="font-size:18px">' + t.score + '/' + t.maxMarks + '</div><div class="xsmall muted">' + t.pct + '%</div></div></div>' +
        '<div class="grid3" style="margin-top:9px">' + B.kpi('Attempted', t.attempted, '') + B.kpi('Correct', t.correct, t.accuracy + '% acc') + B.kpi('Wrong', t.wrong, '') + '</div>' +
        '<div class="grid3" style="margin-top:8px">' + B.kpi('Unattempted', t.unattempted, '') + B.kpi('Time', U.minsToHM(t.timeMin), '') + B.kpi('Score %', t.pct + '%', '') + '</div>' +
        (t.notes ? '<div class="note" style="margin-top:9px">' + U.esc(t.notes) + '</div>' : '') +
        (function () {
          // chapter/topic-wise performance for this test, from questions logged with source = Mock Test on the same date
          const logs = S.state.questions.filter(x => x.source === 'Mock Test' && x.date === t.date);
          if (!logs.length) return '<div class="xsmall muted" style="margin-top:9px">Chapter/topic-wise breakdown: log this test\'s questions in the Question tracker with source &ldquo;Mock Test&rdquo; and date ' + U.fmtDate(t.date, 'short') + ' to see per-chapter accuracy here.</div>';
          const byCh = {};
          logs.forEach(x => {
            const rec = x.chapterId ? Syl.rec(x.chapterId) : null;
            const k = rec ? rec.chapter.name : (x.subject || 'Unassigned');
            byCh[k] = byCh[k] || { a: 0, c: 0 };
            byCh[k].a += x.attempted || 0; byCh[k].c += x.correct || 0;
          });
          return '<div class="hr"></div><div class="small bold" style="margin-bottom:5px">Chapter-wise performance (from ' + logs.length + ' logged logs)</div>' +
            App.charts.hbars(Object.keys(byCh).map(k => ({ label: k, value: byCh[k].a ? Math.round(byCh[k].c / byCh[k].a * 100) : 0, valueText: byCh[k].c + '/' + byCh[k].a + ' correct (' + (byCh[k].a ? Math.round(byCh[k].c / byCh[k].a * 100) : 0) + '%)', color: (byCh[k].a && byCh[k].c / byCh[k].a < .5) ? '#F8A79F' : '#9FDFB1' })));
        })() +

    }
    return { title: 'Mock Tests', sub: 'scores, accuracy, analysis', back: true, html };
  };
  B.action('test-edit', el => { const t = S.state.tests.find(x => x.id === el.getAttribute('data-id')); if (t) App.forms.test(t); });
  B.action('test-del', el => App.mut.deleteEntity('tests', el.getAttribute('data-id')));
  B.action('test-analyse', el => {
    const t = S.state.tests.find(x => x.id === el.getAttribute('data-id'));
    location.hash = '#/gemini?q=' + encodeURIComponent('Analyze this mock test: ' + t.name + ' (' + U.fmtDate(t.date) + ', score ' + t.score + '/' + t.maxMarks + ', accuracy ' + t.accuracy + '%). Subject-wise: ' + JSON.stringify(t.subjects) + '. Use my stored tracker data and tell me exactly what to fix.');
  });

  /* ============================================================== TIMER */
  App.timer = {
    start(opts) {
      S.update(st => {
        st.timer.running = true;
        st.timer.startedAt = new Date().toISOString();
        Object.assign(st.timer, opts || {});
      }, { now: true });
      App.refresh(); App.toast('Timer started');
    },
    stop() {
      const t = S.state.timer;
      if (!t.running || !t.startedAt) return;
      const mins = Math.max(1, Math.round((Date.now() - new Date(t.startedAt).getTime()) / 60000));
      S.update(st => {
        st.sessions.push({
          id: U.uid('ses'), mode: t.mode, subject: t.subject, chapterId: t.chapterId, topicId: t.topicId,
          start: t.startedAt, end: new Date().toISOString(), minutes: mins
        });
        st.timer.running = false; st.timer.startedAt = null;
      }, { now: true });
      if (t.topicId) App.logTimeFor(t.topicId, 'jm', mins);
      App.refresh(); App.toast('Session saved: ' + U.minsToHM(mins));
    },
    cancel() {
      S.update(st => { st.timer.running = false; st.timer.startedAt = null; }, { now: true });
      App.refresh(); App.toast('Timer cancelled');
    },
    elapsedMin() {
      const t = S.state.timer;
      if (!t.running || !t.startedAt) return 0;
      return (Date.now() - new Date(t.startedAt).getTime()) / 60000;
    }
  };

  Sc.timer = function () {
    const t = S.state.timer;
    const elapsed = App.timer.elapsedMin();
    const today = S.state.sessions.filter(s => U.iso(new Date(s.start)) === U.todayISO());
    let html = '<div class="card center" style="padding:22px 16px">' +
      '<div class="xsmall bold muted">STUDY TIMER</div>' +
      '<div id="bigclock" class="count" style="font-size:46px;letter-spacing:-.03em">' + U.minsToClock(t.running ? elapsed : 0) + '</div>' +
      '<div class="small muted" id="clockmeta">' + (t.running ? U.esc(t.mode) + ' &middot; ' + U.esc(t.subject || '') + ' &middot; started ' + new Date(t.startedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Idle - start when you begin') + '</div>' +
      '<div class="btnrow center" style="justify-content:center;margin-top:14px">' +
      (t.running ? '<button class="btn primary" data-act="timer-stop">' + I.stop + ' Stop &amp; save</button><button class="btn ghost" data-act="timer-cancel">Cancel</button>'
        : '<button class="btn primary" data-act="timer-start">' + I.play + ' Start</button>') +
      '</div></div>';
    html += '<div class="card"><div class="card-h"><h3>Session setup</h3></div>' +
      '<div class="two">' + B.field('Mode', B.seg('tmode', ['Lecture', 'Practice', 'Revision', 'PYQ', 'Mock Test', 'Other'].map(m => ({ value: m, label: m })), t.mode)) + '</div>' +
      '<div class="two">' + B.field('Subject', B.seg('tsub', Syl.subjects.map(s => ({ value: s.name, label: B.shortSub(s.name) })), t.subject || 'Physics')) + '</div>' +
      B.field('Chapter', B.select('tchap', [{ value: '', label: '- none -' }].concat(Syl.byCode[(Syl.subjects.find(s => s.name === (t.subject || 'Physics')) || {}).code] ? Syl.byCode[Syl.subjects.find(s => s.name === (t.subject || 'Physics')).code].chapters.map(c => ({ value: c.id, label: c.name })) : []), t.chapterId || '')) +
      B.field('Topic', '<select name="ttopic"><option value="">- none -</option></select>') +
      '<button class="btn sm primary" data-act="timer-apply">Apply setup</button></div>';
    html += '<div class="card"><div class="card-h"><h3>Today&rsquo;s sessions</h3><span class="mini">' + U.minsToHM(U.sum(today, s => s.minutes)) + '</span></div>' +
      (today.length ? today.map(s => '<div class="li" style="margin-bottom:7px"><div class="ico">' + I.clock + '</div><div class="bd"><div class="t">' + U.esc(s.mode) + ' &middot; ' + U.esc(s.subject || '') + '</div>' +
        '<div class="s">' + new Date(s.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date(s.end).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' &middot; ' + U.minsToHM(s.minutes) + (s.topicId && Syl.rec(s.topicId) ? ' &middot; ' + U.esc(Syl.rec(s.topicId).name) : '') + '</div></div></div>').join('')
        : B.empty('No sessions logged today.', '&#9201;')) +
      '<div class="btnrow" style="margin-top:10px"><button class="btn sm" data-act="fab-session">+ Log time manually</button><a class="btn sm" href="#/analytics/overview">See time analytics</a></div></div>';
    return {
      title: 'Study Timer', sub: 'lecture / practice / revision / PYQ', back: true, html,
      after: function (root) {
        const chapSel = root.querySelector('[name="tchap"]');
        const topSel = root.querySelector('[name="ttopic"]');
        const fillTopics = (keep) => {
          const rec = t.chapterId ? Syl.rec(t.chapterId) : null;
          topSel.innerHTML = '<option value="">- none -</option>' + (rec ? rec.chapter.topics.map(x => '<option value="' + x.id + '">' + U.esc(x.name) + '</option>').join('') : '');
          if (keep) topSel.value = keep;
        };
        fillTopics(t.topicId);
        root.querySelectorAll('[data-seg]').forEach(seg => seg.addEventListener('click', e => {
          const b = e.target.closest('[data-segval]'); if (!b) return;
          seg.querySelectorAll('.pill').forEach(x => x.classList.remove('on'));
          b.classList.add('on');
          const h = seg.parentElement.querySelector('input[type="hidden"][name="' + seg.getAttribute('data-seg') + '"]');
          if (h) h.value = b.getAttribute('data-segval');
        }));
        chapSel.addEventListener('change', () => fillTopics(''));
      }
    };
  };
  B.action('timer-start', () => {

  /* ========================================================== ANALYTICS */

      html += '<div class="card"><div class="card-h"><h3>JM vs JA progress</h3><span class="mini">independent scopes</span></div>' +
        App.charts.hbars([

          { label: 'JEE Main - average mastery', value: o.main.mastery, valueText: o.main.mastery + '%', color: '#B9D2FB' },
          { label: 'JEE Advanced - average mastery', value: o.advanced.mastery, valueText: o.advanced.mastery + '%', color: '#F9BDD2' }
        ]) +
        '<div class="xsmall muted">Completing a subtopic for Main never marks it complete for Advanced; each exam keeps its own dimension status, revisions and mastery.</div></div>';
      html += '<div class="card"><div class="card-h"><h3>Subject distribution of study time</h3></div>' +
        App.charts.stacked(Syl.subjects.map(s => ({ label: s.name, value: Calc.subjectTime(30)[s.name] || 0, color: s.code === 'phy' ? '#C3D8FA' : s.code === 'chem' ? '#BFE9CD' : '#FBD2A9' })).concat([{ label: 'Other', value: Calc.subjectTime(30).Other || 0, color: '#EFE7DA' }])) + '</div>';
